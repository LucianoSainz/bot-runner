name: Bot Centinela 10X

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      modo:
        description: "Selecciona qué quieres ejecutar"
        required: true
        default: "bot"
        type: choice
        options:
          - bot
          - backtest

concurrency:
  group: bot-centinela-10x
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar AgentBot privado
        uses: actions/checkout@v4
        with:
          repository: LucianoSainz/AgentBot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Comprobar archivos
        run: |
          echo "============================================"
          echo "BOT CENTINELA 10X"
          echo "============================================"
          pwd
          echo ""
          ls -lah
          echo ""
          echo "requirements.txt:"
          cat requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Comprobar sintaxis Python
        run: |
          python -m py_compile index.py backtest.py mercados.py
          echo "✅ Sintaxis Python correcta"

      - name: Ejecutar Bot Centinela 10X
        if: ${{ github.event_name == 'schedule' || github.event.inputs.modo == 'bot' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "============================================"
          echo "🤖 EJECUTANDO BOT CENTINELA 10X"
          echo "============================================"
          python index.py

      - name: Ejecutar Backtest V4
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'backtest' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "============================================"
          echo "📊 BOT CENTINELA 10X — BACKTEST V4"
          echo "============================================"
          python backtest.py

      - name: Mostrar resultados del backtest
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'backtest' }}
        run: |
          echo "============================================"
          echo "📁 ARCHIVOS GENERADOS"
          echo "============================================"
          ls -lah backtest_*.csv 2>/dev/null || true
          echo ""
          echo "============================================"
          echo "📊 RESUMEN"
          echo "============================================"
          if [ -f backtest_resumen.csv ]; then
            cat backtest_resumen.csv
          else
            echo "No se encontró backtest_resumen.csv"
          fi

      - name: Guardar resultados del backtest
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'backtest' }}
        uses: actions/upload-artifact@v4
        with:
          name: bot-centinela-backtest-${{ github.run_number }}
          path: |
            backtest_resultados.csv
            backtest_trades.csv
            backtest_resumen.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Guardar estado del bot
        if: ${{ github.event_name == 'schedule' || github.event.inputs.modo == 'bot' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- estado_alertas.json señales_log.csv circuit_breaker_estado.json

          if git diff --cached --quiet; then
            echo "ℹ️ No hay cambios de estado para guardar."
          else
            git commit -m "Actualizar estado Bot Centinela 10X"
            git push
          fi
