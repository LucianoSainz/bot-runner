name: Bot Centinela 10X

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      modo:
        description: "Selecciona qué quieres ejecutar"
        required: true
        default: "bot"
        type: choice
        options:
          - bot
          - backtest

concurrency:
  group: bot-centinela-10x
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. DESCARGAR REPOSITORIO PRIVADO
      # ============================================================
      - name: Descargar AgentBot privado
        uses: actions/checkout@v4
        with:
          repository: LucianoSainz/AgentBot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      # ============================================================
      # 2. CONFIGURAR PYTHON
      # ============================================================
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. COMPROBAR ARCHIVOS
      # ============================================================
      - name: Comprobar archivos del repositorio
        run: |
          echo "============================================"
          echo "DIRECTORIO ACTUAL"
          echo "============================================"
          pwd

          echo ""
          echo "============================================"
          echo "ARCHIVOS"
          echo "============================================"
          ls -la

          echo ""
          echo "============================================"
          echo "REQUIREMENTS.TXT"
          echo "============================================"
          cat requirements.txt

      # ============================================================
      # 4. INSTALAR DEPENDENCIAS
      # ============================================================
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ./requirements.txt

      # ============================================================
      # 5. EJECUTAR BOT NORMAL
      #
      # Solo se ejecuta:
      # - automáticamente con cron
      # - manualmente si modo=bot
      # ============================================================
      - name: Ejecutar Bot Centinela 10X
        if: ${{ github.event_name == 'schedule' || github.event.inputs.modo == 'bot' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "============================================"
          echo "🤖 EJECUTANDO BOT CENTINELA 10X"
          echo "============================================"

          python index.py

      # ============================================================
      # 6. EJECUTAR BACKTEST
      #
      # Solo se ejecuta manualmente seleccionando modo=backtest
      # ============================================================
      - name: Ejecutar Backtest V3
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'backtest' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "============================================"
          echo "📊 BOT CENTINELA 10X — BACKTEST V3"
          echo "============================================"

          python backtest.py

      # ============================================================
      # 7. MOSTRAR RESULTADOS DEL BACKTEST
      # ============================================================
      - name: Mostrar archivos generados
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'backtest' }}
        run: |
          echo "============================================"
          echo "📁 ARCHIVOS GENERADOS"
          echo "============================================"

          ls -lah backtest_*.csv 2>/dev/null || true

          echo ""
          echo "============================================"
          echo "📊 RESUMEN"
          echo "============================================"

          if [ -f backtest_resumen.csv ]; then
            cat backtest_resumen.csv
          else
            echo "No se encontró backtest_resumen.csv"
          fi

      # ============================================================
      # 8. GUARDAR RESULTADOS DEL BACKTEST COMO ARTIFACT
      # ============================================================
              - name: Guardar resultados del backtest
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'backtest' }}
        uses: actions/upload-artifact@v4
        with:
          name: bot-centinela-backtest-${{ github.run_number }}
          path: |
            backtest_resultados.csv
            backtest_trades.csv
            backtest_resumen.csv
          if-no-files-found: error
          retention-days: 90

      # ============================================================
      # 9. GUARDAR ESTADO DEL BOT
      #
      # Solo para la ejecución normal del bot.
      # ============================================================
      - name: Guardar estado del bot
        if: ${{ github.event_name == 'schedule' || github.event.inputs.modo == 'bot' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add estado_alertas.json señales_log.csv circuit_breaker_estado.json

          git diff --cached --quiet || git commit -m "Actualizar estado Bot Centinela 10X"

          git push
