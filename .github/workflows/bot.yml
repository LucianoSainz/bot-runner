name: Bot Centinela 10X V6.2

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      modo:
        description: "Selecciona qué quieres ejecutar"
        required: true
        default: "bot"
        type: choice
        options:
          - bot
          - backtest

concurrency:
  group: bot-centinela-10x
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar AgentBot privado
        uses: actions/checkout@v4
        with:
          repository: LucianoSainz/AgentBot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Comprobar archivos
        run: |
          echo "============================================"
          echo "BOT CENTINELA 10X V6.2"
          echo "============================================"
          pwd
          ls -lah
          echo "---- requirements.txt ----"
          cat requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Comprobar sintaxis Python
        run: |
          python -m py_compile index.py backtest.py mercados.py
          echo "✅ Sintaxis Python correcta"

      - name: Ejecutar Bot Centinela 10X V6.2
        if: ${{ github.event_name == 'schedule' || github.event.inputs.modo == 'bot' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python index.py

      - name: Ejecutar Backtest V6
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'backtest' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python backtest.py

      - name: Mostrar resultados V6
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'backtest' }}
        run: |
          echo "===== COMPARACION V6 ====="
          test -f backtest_comparacion_v6.csv && cat backtest_comparacion_v6.csv || true
          echo ""
          echo "===== DIAGNOSTICO V6 ====="
          test -f backtest_diagnostico_v6.csv && cat backtest_diagnostico_v6.csv || true
          echo ""
          ls -lah backtest_*v6.csv 2>/dev/null || true

      - name: Guardar resultados del backtest
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'backtest' }}
        uses: actions/upload-artifact@v4
        with:
          name: bot-centinela-backtest-v6-${{ github.run_number }}
          path: |
            backtest_trades_v6.csv
            backtest_resumen_v6.csv
            backtest_comparacion_v6.csv
            backtest_diagnostico_v6.csv
          if-no-files-found: error
          retention-days: 90

      # IMPORTANTE: el estado de Telegram se guarda SIEMPRE después de
      # procesar index.py. Así la siguiente ejecución recibe el offset nuevo.
      - name: Guardar estado del bot
        if: ${{ github.event_name == 'schedule' || github.event.inputs.modo == 'bot' }}
        run: |
          set -e

          git config user.name "bot-centinela"
          git config user.email "bot-centinela@users.noreply.github.com"

          git add -A -- estado_alertas.json señales_log.csv circuit_breaker_estado.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No hay cambios de estado para guardar."
            exit 0
          fi

          git commit -m "Actualizar estado Bot Centinela 10X V6.2"

          # Sincronizamos antes de publicar para evitar 'fetch first'.
          # Nunca usamos force push.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
