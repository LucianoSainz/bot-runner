name: Bot Centinela 10X

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

concurrency:
  group: bot-centinela-10x
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  ejecutar-bot:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Comprobar archivos del repositorio
        run: |
          echo "Directorio actual:"
          pwd

          echo "Contenido del repositorio:"
          ls -la

          echo "Comprobar requirements.txt:"
          ls -la requirements.txt

          echo "Contenido de requirements.txt:"
          cat requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ./requirements.txt

      - name: Ejecutar Bot Centinela 10X
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python index.py

      - name: Guardar estado del bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add estado_alertas.json señales_log.csv

          git diff --cached --quiet || git commit -m "Actualizar estado Bot Centinela 10X"

          git push
