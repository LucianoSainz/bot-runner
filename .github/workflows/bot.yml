name: Bot Centinela 10X

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      modo:
        description: "Selecciona qué quieres ejecutar"
        required: true
        default: "bot"
        type: choice
        options:
          - bot
          - backtest

concurrency:
  group: bot-centinela-10x
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar AgentBot privado
        uses: actions/checkout@v4
        with:
          repository: LucianoSainz/AgentBot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Comprobar archivos
        run: |
          pwd
          ls -la
          echo "---- requirements.txt ----"
          cat requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar Bot Centinela 10X V5
        if: ${{ github.event_name == 'schedule' || github.event.inputs.modo == 'bot' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python index.py

      - name: Ejecutar Backtest V5
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'backtest' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python backtest.py

      - name: Mostrar resultados
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'backtest' }}
        run: |
          echo "===== backtest_resumen.csv ====="
          test -f backtest_resumen.csv && cat backtest_resumen.csv || true
          echo ""
          echo "===== backtest_comparacion_v5.csv ====="
          test -f backtest_comparacion_v5.csv && cat backtest_comparacion_v5.csv || true
          echo ""
          ls -lah backtest_*.csv 2>/dev/null || true

      - name: Guardar resultados del backtest
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'backtest' }}
        uses: actions/upload-artifact@v4
        with:
          name: bot-centinela-backtest-v5-${{ github.run_number }}
          path: |
            backtest_trades.csv
            backtest_resumen.csv
            backtest_comparacion_v5.csv
          if-no-files-found: error
          retention-days: 90

      - name: Guardar estado del bot
        if: ${{ github.event_name == 'schedule' || github.event.inputs.modo == 'bot' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- estado_alertas.json señales_log.csv circuit_breaker_estado.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Actualizar estado Bot Centinela 10X V5"
          git push
