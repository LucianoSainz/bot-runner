name: Bot Centinela 10X V6.3

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      modo:
        description: "Selecciona qué quieres ejecutar"
        required: true
        default: "bot"
        type: choice
        options:
          - bot
          - backtest

concurrency:
  group: bot-centinela-10x
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar AgentBot privado
        uses: actions/checkout@v4
        with:
          repository: LucianoSainz/AgentBot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Comprobar archivos
        run: |
          echo "============================================"
          echo "BOT CENTINELA 10X V6.3"
          echo "============================================"
          pwd
          ls -lah
          echo "---- requirements.txt ----"
          cat requirements.txt

          - name: Instalar dependencias
            run: |
            set -e

            python -m pip install --upgrade pip

            for intento in 1 2 3 4 5; do
            echo "============================================"
            echo "Instalación de dependencias - intento $intento/5"
            echo "============================================"

            if python -m pip install \
            --disable-pip-version-check \
            --default-timeout=60 \
            --retries=10 \
            -r requirements.txt; then
            echo "✅ Dependencias instaladas correctamente"
            exit 0
            fi

          echo "⚠️ Falló el intento $intento. Esperando antes de reintentar..."
          sleep 15
          done

          echo "❌ No se pudieron instalar las dependencias después de 5 intentos."
          exit 1

      - name: Comprobar sintaxis Python
        run: |
          python -m py_compile index.py backtest.py mercados.py
          echo "✅ Sintaxis Python correcta"

      - name: Ejecutar Bot Centinela 10X V6.3
        if: ${{ github.event_name == 'schedule' || github.event.inputs.modo == 'bot' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python index.py

      - name: Ejecutar Backtest V6
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'backtest' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python backtest.py

      - name: Mostrar resultados V6
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'backtest' }}
        run: |
          echo "===== COMPARACION V6 ====="
          test -f backtest_comparacion_v6.csv && cat backtest_comparacion_v6.csv || true
          echo ""
          echo "===== DIAGNOSTICO V6 ====="
          test -f backtest_diagnostico_v6.csv && cat backtest_diagnostico_v6.csv || true
          echo ""
          ls -lah backtest_*v6.csv 2>/dev/null || true

      - name: Guardar resultados del backtest
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'backtest' }}
        uses: actions/upload-artifact@v4
        with:
          name: bot-centinela-backtest-v6-${{ github.run_number }}
          path: |
            backtest_trades_v6.csv
            backtest_resumen_v6.csv
            backtest_comparacion_v6.csv
            backtest_diagnostico_v6.csv
          if-no-files-found: error
          retention-days: 90

      - name: Guardar estado del bot
        if: ${{ github.event_name == 'schedule' || github.event.inputs.modo == 'bot' }}
        run: |
          set -e

          git config user.name "bot-centinela"
          git config user.email "bot-centinela@users.noreply.github.com"

          # Los archivos principales siempre se añaden por separado para que
          # la ausencia de circuit_breaker_estado.json no bloquee el commit.
          git add -A -- estado_alertas.json señales_log.csv

          if [ -f circuit_breaker_estado.json ]; then
            git add -A -- circuit_breaker_estado.json
          fi

          echo "===== ESTADO GIT ====="
          git status --short

          if git diff --cached --quiet; then
            echo "No hay cambios de estado para guardar."
            exit 0
          fi

          git commit -m "Actualizar estado Bot Centinela 10X V6.3"

          # El checkout tiene fetch-depth 0. Sincronizamos antes de publicar
          # para evitar el error 'fetch first'. Nunca usamos force push.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
