
name: Bot Centinela 10x
on:
  schedule:
    # Se ejecuta cada hora, de 13:00 a 21:00 UTC, de lunes a viernes (1-5)
    # Corre en el minuto 7 (no en :00) para evitar el embudo de miles de workflows
    # que GitHub recibe justo en el minuto en punto de cada hora.
    - cron: '7 13-21 * * 1-5'
  workflow_dispatch:      # Permite que sigas ejecutándolo manualmente cuando quieras

permissions:
  contents: write         # Necesario para poder commitear el estado y el log de señales de vuelta al repo

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repo Privado (código real)
        uses: actions/checkout@v4
        with:
          repository: LucianoSainz/AgentBot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python index.py

      - name: Guardar estado y log de señales
        run: |
          git config --global user.name "bot-centinela"
          git config --global user.email "bot-centinela@users.noreply.github.com"
          git add estado_alertas.json
          if [ -f señales_log.csv ]; then
            git add señales_log.csv
          fi
          git diff --staged --quiet || git commit -m "Actualiza estado y log de señales [skip ci]"
          git push
