name: Bot Centinela - Backtest MTF
on:
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LucianoSainz/AgentBot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python backtest.py
      - name: Guardar backtest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtest_resultados.csv
          git diff --cached --quiet || (git commit -m 'Actualizar backtest MTF' && git pull --rebase origin main && git push origin HEAD:main)
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-mtf
          path: backtest_resultados.csv
