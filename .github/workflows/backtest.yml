name: Bot Centinela - Backtest
on:
  workflow_dispatch:   # Solo corre cuando vos lo disparás manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # el backtest baja ~2 años de datos por ticker, puede tardar varios minutos

    steps:
      - name: Checkout Repo Privado (código real)
        uses: actions/checkout@v4
        with:
          repository: TU_USUARIO/TU_REPO_PRIVADO
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Correr backtest
        run: python backtest.py

      - name: Guardar resultados del backtest
        run: |
          git config --global user.name "bot-centinela"
          git config --global user.email "bot-centinela@users.noreply.github.com"
          if [ -f backtest_resultados.csv ]; then
            git add backtest_resultados.csv
            if git diff --staged --quiet; then
              echo "Sin cambios para commitear."
            else
              git commit -m "Actualiza resultados del backtest [skip ci]"
              for intento in 1 2 3 4 5; do
                git pull --rebase origin main && git push && break
                echo "Push rechazado (intento $intento), reintentando..."
                sleep $((RANDOM % 8 + 3))
              done
            fi
          fi

      - name: Subir resultados como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: backtest-resultados
          path: backtest_resultados.csv
          if-no-files-found: warn
